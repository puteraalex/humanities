<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Humanities: Mars Outpost Trainer</title>
  </head>
  <body>
    <div id="announce" class="sr-only" aria-live="polite"></div>
    <main id="title" hidden></main>
    <main id="story" hidden></main>
    <main id="prep" hidden></main>
    <main id="debrief" hidden></main>
    <div id="app" hidden>
      <header id="topbar" class="panel"></header>
      <aside id="env" class="panel" aria-label="Outpost conditions"></aside>
      <main class="view">
        <div id="game" role="img" aria-label="Illustration of the Mars outpost"></div>
        <div id="dialogue" class="dialogue" aria-live="polite" hidden></div>
      </main>
      <aside id="alerts" class="panel" aria-live="polite" aria-label="Mission alerts"></aside>
      <section id="systems" class="panel" aria-label="Outpost systems"></section>
      <section id="decision" class="panel" aria-label="Decisions"></section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
